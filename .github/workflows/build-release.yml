name: Build and Release UART_Y0429 (Windows)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyserial tk

      - name: Build executable
        run: pyinstaller --name "UART_Y0429" --onefile --windowed "UART Y0429.py"

      - name: Archive executable
        run: Compress-Archive -Path dist\UART_Y0429.exe -DestinationPath dist\UART_Y0429_Windows.zip

      - name: Create GitHub Release and Upload Asset
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/UART_Y0429_Windows.zip
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
