name: Build and Release UART_Y0429 (Windows)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyserial tk pyinstaller

      - name: Build executable
        run: pyinstaller --name "UART_Y0429" --onefile "UART Y0429.py"

      - name: Archive executable
        shell: powershell
        run: |
          Compress-Archive -Path dist\UART_Y0429.exe -DestinationPath dist\UART_Y0429_Windows.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist\UART_Y0429_Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
